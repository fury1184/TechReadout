<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - {{ APP_NAME }}</title>
    <script>
        (function () {
            let saved = null;
            try { saved = localStorage.getItem('tr-theme'); } catch (e) {}
            const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <form method="post" class="card shadow-sm p-4" style="width: 100%; max-width: 360px;">
        <h1 class="h4 mb-3 text-center"><i class="bi bi-cpu"></i> {{ APP_NAME }}</h1>
        {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
</body>
</html>
